<!DOCTYPE html>
<html lang="ko" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 업무·스케줄 관리 볼트</title>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- CryptoJS: AES-256 클라이언트 종단간 암호화 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    /* ==========================================================================
       테마 디자인 시스템 (Design Themes)
       ========================================================================== */
    
    /* 1. 🌌 모던 미드나잇 (기본 다크) */
    :root, [data-theme="midnight"] {
      --bg-color: #0b1120;
      --bg-pattern: radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.08) 0%, transparent 40%),
                         radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
      --card-bg: #151e32;
      --card-hover: #1e2942;
      --card-sub: rgba(11, 17, 32, 0.55);
      --border-color: #26334d;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px -4px rgba(0,0,0,0.4);
      --shadow-lg: 0 16px 36px -6px rgba(0,0,0,0.6);
      /* 카테고리 태그 색상 */
      --cat-meet-bg: #1e3a8a; --cat-meet-fg: #bfdbfe;
      --cat-rep-bg: #064e3b;  --cat-rep-fg: #a7f3d0;
      --cat-talk-bg: #831843; --cat-talk-fg: #fbcfe8;
      --cat-lec-bg: #581c87;  --cat-lec-fg: #e9d5ff;
      --cat-etc-bg: #334155;  --cat-etc-fg: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    /* 2. ☀️ 미니멀 클린 화이트 (라이트 모드) */
    [data-theme="light"] {
      --bg-color: #f6f8fb;
      --bg-pattern: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.04) 0%, transparent 35%),
                         radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.04) 0%, transparent 35%);
      --card-bg: #ffffff;
      --card-hover: #f8fafc;
      --card-sub: #f1f5f9;
      --border-color: #e2e8f0;
      --border-focus: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.18);
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 14px -1px rgba(0,0,0,0.08);
      --shadow-lg: 0 14px 28px -4px rgba(0,0,0,0.12);
      --cat-meet-bg: #dbeafe; --cat-meet-fg: #1d4ed8;
      --cat-rep-bg: #d1fae5;  --cat-rep-fg: #047857;
      --cat-talk-bg: #fce7f3; --cat-talk-fg: #be185d;
      --cat-lec-bg: #ede9fe;  --cat-lec-fg: #6d28d9;
      --cat-etc-bg: #e2e8f0;  --cat-etc-fg: #475569;
    }

    /* 3. 🌿 코지 세이지 (포레스트) */
    [data-theme="forest"] {
      --bg-color: #0d1712;
      --bg-pattern: radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                         radial-gradient(circle at 80% 80%, rgba(5, 150, 105, 0.06) 0%, transparent 40%);
      --card-bg: #14231c;
      --card-hover: #1c3227;
      --card-sub: rgba(13, 23, 18, 0.65);
      --border-color: #234033;
      --border-focus: #10b981;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --text-sub: #4ade80;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
      --shadow-md: 0 8px 24px -4px rgba(0,0,0,0.45);
      --shadow-lg: 0 16px 36px -6px rgba(0,0,0,0.65);
      --cat-meet-bg: #064e3b; --cat-meet-fg: #a7f3d0;
      --cat-rep-bg: #065f46;  --cat-rep-fg: #6ee7b7;
      --cat-talk-bg: #701a75; --cat-talk-fg: #f5d0fe;
      --cat-lec-bg: #312e81;  --cat-lec-fg: #c7d2fe;
      --cat-etc-bg: #2d3b34;  --cat-etc-fg: #d1fae5;
    }

    /* 4. 🔮 사이버 네온 (네온 다크) */
    [data-theme="cyberpunk"] {
      --bg-color: #06060c;
      --bg-pattern: radial-gradient(circle at 10% 10%, rgba(6, 182, 212, 0.12) 0%, transparent 35%),
                         radial-gradient(circle at 90% 90%, rgba(217, 70, 239, 0.1) 0%, transparent 35%);
      --card-bg: #0d0f1e;
      --card-hover: #171b33;
      --card-sub: rgba(6, 6, 12, 0.8);
      --border-color: #222947;
      --border-focus: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #6366f1;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --accent-glow: rgba(6, 182, 212, 0.4);
      --danger: #ff0055;
      --success: #00ff9d;
      --warning: #ffb703;
      --shadow-sm: 0 2px 10px rgba(6, 182, 212, 0.1);
      --shadow-md: 0 6px 20px rgba(6, 182, 212, 0.18);
      --shadow-lg: 0 12px 32px rgba(217, 70, 239, 0.22);
      --cat-meet-bg: #083344; --cat-meet-fg: #67e8f9;
      --cat-rep-bg: #022c22;  --cat-rep-fg: #5eead4;
      --cat-talk-bg: #500724; --cat-talk-fg: #f472b6;
      --cat-lec-bg: #3b0764;  --cat-lec-fg: #d8b4fe;
      --cat-etc-bg: #1e1b4b;  --cat-etc-fg: #c7d2fe;
    }

    /* 5. 🌅 웜 선셋 (테라코타 다크) */
    [data-theme="sunset"] {
      --bg-color: #171412;
      --bg-pattern: radial-gradient(circle at 15% 15%, rgba(249, 115, 22, 0.09) 0%, transparent 40%),
                         radial-gradient(circle at 85% 85%, rgba(234, 88, 12, 0.07) 0%, transparent 40%);
      --card-bg: #241f1c;
      --card-hover: #312b27;
      --card-sub: rgba(23, 20, 18, 0.65);
      --border-color: #3d352e;
      --border-focus: #f97316;
      --text-main: #fbf7f4;
      --text-muted: #d6cfc7;
      --text-sub: #a89f91;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-glow: rgba(249, 115, 22, 0.25);
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
      --shadow-md: 0 8px 24px -4px rgba(0,0,0,0.45);
      --shadow-lg: 0 16px 36px -6px rgba(0,0,0,0.65);
      --cat-meet-bg: #431407; --cat-meet-fg: #ffedd5;
      --cat-rep-bg: #064e3b;  --cat-rep-fg: #a7f3d0;
      --cat-talk-bg: #701a75; --cat-talk-fg: #fdf4ff;
      --cat-lec-bg: #451a03;  --cat-lec-fg: #fed7aa;
      --cat-etc-bg: #292524;  --cat-etc-fg: #e7e5e4;
    }

    /* 6. 🌸 소프트 라벤더 (파스텔 라이트) */
    [data-theme="lavender"] {
      --bg-color: #f7f5ff;
      --bg-pattern: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.07) 0%, transparent 40%),
                         radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 40%);
      --card-bg: #ffffff;
      --card-hover: #faf8ff;
      --card-sub: #f1edff;
      --border-color: #e5defb;
      --border-focus: #8b5cf6;
      --text-main: #1e1533;
      --text-muted: #6b5e8a;
      --text-sub: #9e93bc;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.22);
      --danger: #e11d48;
      --success: #059669;
      --warning: #d97706;
      --shadow-sm: 0 1px 4px rgba(139, 92, 246, 0.08);
      --shadow-md: 0 6px 18px -2px rgba(139, 92, 246, 0.12);
      --shadow-lg: 0 16px 32px -4px rgba(139, 92, 246, 0.16);
      --cat-meet-bg: #ede9fe; --cat-meet-fg: #6d28d9;
      --cat-rep-bg: #d1fae5;  --cat-rep-fg: #065f46;
      --cat-talk-bg: #fce7f3; --cat-talk-fg: #9d174d;
      --cat-lec-bg: #fae8ff;  --cat-lec-fg: #86198f;
      --cat-etc-bg: #e2e8f0;  --cat-etc-fg: #475569;
    }

    /* ==========================================================================
       기본 베이스 & 레이아웃 스타일
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease, box-shadow 0.25s ease;
    }

    body {
      background-color: var(--bg-color);
      background-image: var(--bg-pattern);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 통합 헤더 */
    .header-bar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .top-brand-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--accent);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px var(--accent-glow);
    }

    /* 테마 선택기 바 */
    .theme-selector-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 6px;
      border-radius: 30px;
      box-shadow: var(--shadow-sm);
    }

    .theme-selector-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding-left: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .theme-pill-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .theme-btn {
      border: none;
      background: transparent;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      color: var(--text-main);
      background: var(--card-hover);
    }

    .theme-btn.active {
      background: var(--accent);
      color: #ffffff !important;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    /* 네비게이션 & 툴바 */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: var(--card-hover);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .action-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    /* 공통 버튼 & 인풋 스타일 */
    button, select, input[type="text"], input[type="password"], input[type="date"], textarea {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    button:hover {
      background-color: var(--card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-primary {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #ffffff !important;
      box-shadow: 0 3px 10px var(--accent-glow) !important;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover) !important;
      border-color: var(--accent-hover) !important;
    }

    /* 클라우드 동기화 배지 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }

    .status-badge.online {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
    }

    .status-badge.syncing {
      border-color: rgba(59, 130, 246, 0.4);
      background: rgba(59, 130, 246, 0.12);
      color: var(--accent);
    }

    .status-badge.offline {
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.08);
      color: var(--danger);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* 공통 뷰 패널 */
    .view-panel {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.25s ease;
    }

    .view-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       1. ⭐ 오늘 할 일 뷰 (Today View) 전용 스타일
       ========================================================================== */
    .today-hero-card {
      background: var(--card-sub);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .today-hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 5px;
      background: var(--accent);
    }

    .today-hero-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 250px;
    }

    .today-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .today-date-heading {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .today-subtext {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .today-progress-wrap {
      width: 100%;
      max-width: 380px;
      height: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }

    .today-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* 원클릭 즉시 입력 폼 바 */
    .quick-input-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--card-sub);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      align-items: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .quick-input-bar select {
      min-width: 110px;
      font-weight: 600;
    }

    .quick-input-bar input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    /* 카테고리 필터 칩 바 */
    .filter-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    .filter-chip {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-chip:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 6px var(--accent-glow);
    }

    /* ==========================================================================
       캘린더 뷰 (Month View)
       ========================================================================== */
    .calendar-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .cal-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-header-day {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 8px 0;
    }

    .cal-header-day:first-child { color: var(--danger); }
    .cal-header-day:last-child { color: var(--accent); }

    .cal-cell {
      min-height: 108px;
      background: var(--card-sub);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }

    .cal-cell:hover {
      background: var(--card-hover);
      border-color: var(--border-focus);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      z-index: 2;
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.today {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.05);
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    .cal-cell.today .cal-date-num {
      background: var(--accent);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 12px;
      display: inline-block;
      width: fit-content;
      box-shadow: 0 2px 6px var(--accent-glow);
    }

    .cal-date-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .cal-cell-events {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .event-pill {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 5px;
      background: var(--card-hover);
      border-left: 3px solid var(--accent);
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .event-pill.done {
      text-decoration: line-through;
      opacity: 0.45;
      border-left-color: var(--text-sub);
    }

    /* 카테고리 태그 시스템 */
    .cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .cat-tag::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .cat-회의 { background: var(--cat-meet-bg); color: var(--cat-meet-fg); }
    .cat-보고 { background: var(--cat-rep-bg);  color: var(--cat-rep-fg); }
    .cat-면담 { background: var(--cat-talk-bg); color: var(--cat-talk-fg); }
    .cat-강의 { background: var(--cat-lec-bg);  color: var(--cat-lec-fg); }
    .cat-기타 { background: var(--cat-etc-bg);  color: var(--cat-etc-fg); }

    /* 리스트 스타일 */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--card-sub);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .task-item:hover {
      border-color: var(--border-focus);
      background: var(--card-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
      border-radius: 4px;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 14.5px;
      font-weight: 600;
      word-break: break-all;
      color: var(--text-main);
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.55;
    }

    .task-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 5px;
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    .task-actions button {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* 주간 그룹 카드 */
    .week-day-group {
      background: var(--card-sub);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .week-day-header {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .week-day-header.is-today {
      color: var(--accent);
    }

    /* ==========================================================================
       모달 다이얼로그 (Modals with Glass Blur)
       ========================================================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 490px;
      max-width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-lg);
    }

    .modal-head {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-row label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-row-group {
      display: flex;
      gap: 10px;
    }

    .form-row-group > * {
      flex: 1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .day-tasks-container {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 0;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 820px) {
      body { padding: 12px; }
      .header-bar { gap: 12px; }
      .theme-pill-group { overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
      .cal-cell { min-height: 75px; padding: 4px; }
      .event-pill { font-size: 10px; padding: 2px 4px; }
      .action-tools { width: 100%; justify-content: flex-start; }
      .nav-tabs { overflow-x: auto; width: 100%; }
      .quick-input-bar { flex-direction: column; align-items: stretch; }
      .quick-input-bar button { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 & 컨트롤 영역 -->
  <header class="header-bar">
    <!-- 최상단: 브랜드 로고 & 다중 디자인 테마 선택 바 -->
    <div class="top-brand-row">
      <div class="brand-logo">
        <span>🛡️ 스마트 업무 볼트</span>
        <span class="brand-badge">PRO VAULT</span>
      </div>

      <!-- 다중 테마 선택기 (6개 디자인 버전) -->
      <div class="theme-selector-wrap">
        <span class="theme-selector-label">🎨 디자인 테마:</span>
        <div class="theme-pill-group">
          <button class="theme-btn active" data-theme-target="midnight" onclick="setAppTheme('midnight')">
            <span class="theme-dot" style="background:#3b82f6;"></span>미드나잇
          </button>
          <button class="theme-btn" data-theme-target="light" onclick="setAppTheme('light')">
            <span class="theme-dot" style="background:#ffffff; border:1px solid #cbd5e1;"></span>클린라이트
          </button>
          <button class="theme-btn" data-theme-target="forest" onclick="setAppTheme('forest')">
            <span class="theme-dot" style="background:#10b981;"></span>포레스트
          </button>
          <button class="theme-btn" data-theme-target="cyberpunk" onclick="setAppTheme('cyberpunk')">
            <span class="theme-dot" style="background:#06b6d4;"></span>사이버네온
          </button>
          <button class="theme-btn" data-theme-target="sunset" onclick="setAppTheme('sunset')">
            <span class="theme-dot" style="background:#f97316;"></span>웜선셋
          </button>
          <button class="theme-btn" data-theme-target="lavender" onclick="setAppTheme('lavender')">
            <span class="theme-dot" style="background:#8b5cf6;"></span>라벤더
          </button>
        </div>
      </div>
    </div>

    <!-- 하단: 뷰 전환 탭 & 유틸리티 버튼 -->
    <div class="controls-row">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('today')">⭐ 오늘 할 일</button>
        <button class="tab-btn" onclick="switchView('month')">📅 월간 달력</button>
        <button class="tab-btn" onclick="switchView('week')">📆 주간 업무</button>
        <button class="tab-btn" onclick="switchView('all')">📋 전체 할 일</button>
      </div>

      <div class="action-tools">
        <span id="syncStatus" class="status-badge offline"><span class="status-dot"></span>오프라인 모드</span>
        <button onclick="openSyncModal()">🔒 깃허브 보안 동기화</button>
        <button onclick="triggerManualSync()">🔄 즉시 동기화</button>
        <button onclick="exportBackup()">📥 백업</button>
        <button onclick="importBackup()">📤 복원</button>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       1. ⭐ 오늘 할 일 뷰 (Today View)
       ========================================================================= -->
  <main id="view-today" class="view-panel active">
    <!-- 오늘 요약 헤더 카드 -->
    <div class="today-hero-card">
      <div class="today-hero-left">
        <div class="today-badge">TODAY'S SCHEDULE</div>
        <h2 class="today-date-heading" id="todayHeadingText">2026년 11월 3일</h2>
        <div class="today-subtext" id="todayProgressText">총 0건의 업무 중 0건 완료 (0%)</div>
        <div class="today-progress-wrap">
          <div class="today-progress-fill" id="todayProgressBar" style="width: 0%;"></div>
        </div>
      </div>
      <div>
        <button class="btn-primary" onclick="openCreateModal(formatLocalDate(new Date()))">+ 일정 등록 모달</button>
      </div>
    </div>

    <!-- 오늘 할 일 즉시 등록 바 (입력 시 월간/주간/전체에도 동시 연동) -->
    <div class="quick-input-bar">
      <select id="todayCategoryInput">
        <option value="회의">💼 회의</option>
        <option value="보고">📑 보고</option>
        <option value="면담">🤝 면담</option>
        <option value="강의">🎓 강의</option>
        <option value="기타" selected>📌 기타</option>
      </select>
      <input type="text" id="todayTaskInput" placeholder="오늘 해야 할 일을 입력하세요... (Enter 키로 즉시 추가)" onkeydown="if(event.key==='Enter') addTodayTaskDirect()">
      <button class="btn-primary" onclick="addTodayTaskDirect()">+ 오늘 할 일 추가</button>
    </div>

    <!-- 오늘 할 일 카테고리 필터 칩 -->
    <div class="filter-chips-row">
      <span style="font-size:12px; font-weight:700; color:var(--text-muted); margin-right:4px;">유형별 필터:</span>
      <button class="filter-chip active" onclick="setTodayFilter('all', this)">전체</button>
      <button class="filter-chip" onclick="setTodayFilter('회의', this)">회의</button>
      <button class="filter-chip" onclick="setTodayFilter('보고', this)">보고</button>
      <button class="filter-chip" onclick="setTodayFilter('면담', this)">면담</button>
      <button class="filter-chip" onclick="setTodayFilter('강의', this)">강의</button>
      <button class="filter-chip" onclick="setTodayFilter('기타', this)">기타</button>
    </div>

    <!-- 오늘 할 일 목록 -->
    <div class="task-list" id="todayTaskList"></div>
  </main>

  <!-- =========================================================================
       2. 📅 월간 달력 뷰 (Month View)
       ========================================================================= -->
  <section id="view-month" class="view-panel">
    <div class="calendar-container">
      <div class="cal-controls">
        <button onclick="moveMonth(-1)">◀ 이전달</button>
        <span class="cal-title" id="calMonthTitle"></span>
        <button onclick="moveMonth(1)">다음달 ▶</button>
      </div>
      <div class="cal-grid">
        <div class="cal-header-day">일</div>
        <div class="cal-header-day">월</div>
        <div class="cal-header-day">화</div>
        <div class="cal-header-day">수</div>
        <div class="cal-header-day">목</div>
        <div class="cal-header-day">금</div>
        <div class="cal-header-day">토</div>
      </div>
      <div class="cal-grid" id="calDaysGrid"></div>
    </div>
  </section>

  <!-- =========================================================================
       3. 📆 주간 업무 뷰 (Week View)
       ========================================================================= -->
  <section id="view-week" class="view-panel">
    <div class="cal-controls" style="margin-bottom: 14px;">
      <button onclick="moveWeek(-1)">◀ 이전주</button>
      <span class="cal-title" id="weekTitle">이번 주 업무</span>
      <button onclick="moveWeek(1)">다음주 ▶</button>
    </div>

    <!-- 주간 즉시 추가 바 -->
    <div class="quick-input-bar">
      <input type="date" id="weekQuickDate">
      <select id="weekQuickCategory">
        <option value="회의">💼 회의</option>
        <option value="보고">📑 보고</option>
        <option value="면담">🤝 면담</option>
        <option value="강의">🎓 강의</option>
        <option value="기타" selected>📌 기타</option>
      </select>
      <input type="text" id="weekQuickTitle" placeholder="해당 주간에 등록할 업무를 입력하세요 (Enter 키로 추가)" onkeydown="if(event.key==='Enter') addWeekTaskDirect()">
      <button class="btn-primary" onclick="addWeekTaskDirect()">+ 주간 일정 추가</button>
    </div>

    <div class="task-list" id="weekTaskList"></div>
  </section>

  <!-- =========================================================================
       4. 📋 전체 할 일 뷰 (All View)
       ========================================================================= -->
  <section id="view-all" class="view-panel">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px;">
      <span class="cal-title">전체 등록된 일정 및 할 일</span>
      <button class="btn-primary" onclick="openCreateModal()">+ 새 일정 등록</button>
    </div>

    <!-- 전체 뷰 필터 칩 -->
    <div class="filter-chips-row">
      <span style="font-size:12px; font-weight:700; color:var(--text-muted); margin-right:4px;">유형별 필터:</span>
      <button class="filter-chip active" onclick="setAllFilter('all', this)">전체</button>
      <button class="filter-chip" onclick="setAllFilter('회의', this)">회의</button>
      <button class="filter-chip" onclick="setAllFilter('보고', this)">보고</button>
      <button class="filter-chip" onclick="setAllFilter('면담', this)">면담</button>
      <button class="filter-chip" onclick="setAllFilter('강의', this)">강의</button>
      <button class="filter-chip" onclick="setAllFilter('기타', this)">기타</button>
    </div>

    <div class="task-list" id="allTaskList"></div>
  </section>

  <!-- =========================================================================
       일자 클릭 팝업 (해당 일자 상세 조회 및 간편 추가 모달)
       ========================================================================= -->
  <div class="modal-overlay" id="dayDetailModal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="dayModalDateTitle">일정 상세</span>
        <button onclick="closeDayModal()" style="border:none; background:none; font-size:18px; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      
      <div class="form-row">
        <label>해당 일자 등록된 일정</label>
        <div class="day-tasks-container" id="dayModalTasksList"></div>
      </div>

      <div style="border-top: 1px solid var(--border-color); padding-top: 14px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 700; color:var(--text-main);">+ 이 날짜에 새 일정 추가</span>
        <div class="form-row">
          <input type="text" id="quickTaskTitle" placeholder="업무 내용을 입력하세요 (예: 2차 기획회의 진행)" onkeydown="if(event.key==='Enter') addQuickTask()">
        </div>
        <div class="form-row-group">
          <input type="text" id="quickTaskCategory" list="categoryOptions" placeholder="유형 (회의/보고/면담/강의/기타)">
          <datalist id="categoryOptions">
            <option value="회의">
            <option value="보고">
            <option value="면담">
            <option value="강의">
            <option value="기타">
          </datalist>
          <button class="btn-primary" onclick="addQuickTask()">추가</button>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       개별 일정 등록/수정 모달
       ========================================================================= -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="editModalTitle">일정 등록/수정</span>
        <button onclick="closeEditModal()" style="border:none; background:none; font-size:18px; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      <input type="hidden" id="editTaskId">
      <div class="form-row">
        <label>업무 내용</label>
        <input type="text" id="editTitle" placeholder="업무 내용을 입력하세요">
      </div>
      <div class="form-row-group">
        <div class="form-row">
          <label>마감/수행일자</label>
          <input type="date" id="editDate">
        </div>
        <div class="form-row">
          <label>분류 유형 (직접 입력 가능)</label>
          <input type="text" id="editCategory" list="categoryOptions" placeholder="회의, 보고, 면담 등">
        </div>
      </div>
      <div class="form-row-group">
        <div class="form-row">
          <label>상태 구분</label>
          <select id="editStatus">
            <option value="할일">할 일 (진행대기)</option>
            <option value="한일">한 일 (완료/삭선)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeEditModal()">취소</button>
        <button class="btn-primary" onclick="saveTaskDetails()">저장</button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       깃허브 보안 동기화 모달
       ========================================================================= -->
  <div class="modal-overlay" id="syncModal">
    <div class="modal-box">
      <div class="modal-head">
        <span>🔒 깃허브 보안 동기화 설정</span>
        <button onclick="closeSyncModal()" style="border:none; background:none; font-size:18px; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      <div class="form-row">
        <label>GitHub 개인 접근 토큰 (Fine-grained PAT / ghp_...)</label>
        <input type="password" id="ghToken" placeholder="github_pat_ 또는 ghp_...">
      </div>
      <div class="form-row-group">
        <div class="form-row">
          <label>GitHub 아이디 (Owner)</label>
          <input type="text" id="ghOwner" placeholder="깃허브 사용자명">
        </div>
        <div class="form-row">
          <label>비공개 저장소 이름</label>
          <input type="text" id="ghRepo" value="my-task-vault">
        </div>
      </div>
      <div class="form-row">
        <label>AES-256 종단간 암호화 마스터 키 (기기 공통 비밀번호)</label>
        <input type="password" id="ghSecretKey" placeholder="기기간 데이터 복호화를 위한 공통 마스터 암호">
      </div>
      <div class="modal-footer">
        <button onclick="closeSyncModal()">취소</button>
        <button class="btn-primary" onclick="saveSyncSettings()">저장 및 동기화 시작</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================================
    // 테마 제어 로직 (Theme Management)
    // ==========================================================================
    const THEMES = ['midnight', 'light', 'forest', 'cyberpunk', 'sunset', 'lavender'];
    let currentTheme = localStorage.getItem('vault_selected_theme') || 'midnight';

    function setAppTheme(themeName) {
      if (!THEMES.includes(themeName)) themeName = 'midnight';
      currentTheme = themeName;
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('vault_selected_theme', themeName);

      // 테마 버튼 활성화 상태 갱신
      document.querySelectorAll('.theme-btn').forEach(btn => {
        if (btn.getAttribute('data-theme-target') === themeName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // ==========================================================================
    // 앱 상태 관리 & 초기화
    // ==========================================================================
    let tasks = JSON.parse(localStorage.getItem('vault_tasks') || '[]');
    let syncConfig = JSON.parse(localStorage.getItem('vault_sync_cfg') || '{}');
    let currentViewDate = new Date(); // 달력 탐색 기준
    let currentWeekDate = new Date(); // 주간 탐색 기준
    let selectedDateStr = '';
    let currentSha = null;
    let isSyncing = false;

    // 필터 상태
    let todayFilterCategory = 'all';
    let allFilterCategory = 'all';

    // 최초 실행
    init();

    function init() {
      // 테마 초기화
      setAppTheme(currentTheme);

      // 주간 빠른 추가 날짜 기본값 설정 (오늘)
      const weekQuickEl = document.getElementById('weekQuickDate');
      if (weekQuickEl) weekQuickEl.value = formatLocalDate(new Date());

      // 모든 뷰 렌더링 (오늘, 월간, 주간, 전체 상호 연동)
      renderAllViews();

      if (syncConfig.token && syncConfig.owner && syncConfig.repo && syncConfig.secretKey) {
        pullFromGitHub();
        // 15초 주기 다중 기기 실시간 변경 감지
        setInterval(() => {
          if (!isSyncing && syncConfig.token) pullFromGitHub(true);
        }, 15000);
      } else {
        updateSyncStatus('offline');
      }
    }

    // 뷰 전환 (오늘 / 월간 / 주간 / 전체)
    function switchView(viewName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      
      const tabButtons = document.querySelectorAll('.tab-btn');
      if (viewName === 'today') {
        tabButtons[0].classList.add('active');
        document.getElementById('view-today').classList.add('active');
        renderTodayTasks();
      } else if (viewName === 'month') {
        tabButtons[1].classList.add('active');
        document.getElementById('view-month').classList.add('active');
        renderCalendar();
      } else if (viewName === 'week') {
        tabButtons[2].classList.add('active');
        document.getElementById('view-week').classList.add('active');
        renderWeekly();
      } else {
        tabButtons[3].classList.add('active');
        document.getElementById('view-all').classList.add('active');
        renderAllTasks();
      }
    }

    // 모든 뷰 동시 갱신 (어느 뷰에서 추가/수정하든 모든 뷰에 자동 연동)
    function renderAllViews() {
      renderTodayTasks();
      renderCalendar();
      renderWeekly();
      renderAllTasks();
    }

    // ==========================================================================
    // 1. ⭐ 오늘 할 일 렌더링 & 빠른 추가 (Today View)
    // ==========================================================================
    function setTodayFilter(category, btnEl) {
      todayFilterCategory = category;
      btnEl.parentElement.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderTodayTasks();
    }

    function renderTodayTasks() {
      const today = new Date();
      const todayStr = formatLocalDate(today);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = days[today.getDay()];

      // 헤더 날짜 텍스트
      const headingEl = document.getElementById('todayHeadingText');
      if (headingEl) {
        headingEl.innerText = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 (${dayName}요일)`;
      }

      // 오늘의 전체 일정 필터링
      const todayAllTasks = tasks.filter(t => t.date === todayStr);
      const completedCount = todayAllTasks.filter(t => t.completed).length;
      const totalCount = todayAllTasks.length;
      const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      // 프로그레스 바 & 서브텍스트
      const progressTextEl = document.getElementById('todayProgressText');
      const progressBarEl = document.getElementById('todayProgressBar');
      if (progressTextEl) {
        progressTextEl.innerText = `총 ${totalCount}건의 업무 중 ${completedCount}건 완료 (${percent}%)`;
      }
      if (progressBarEl) {
        progressBarEl.style.width = `${percent}%`;
        progressBarEl.style.background = percent === 100 ? 'var(--success)' : 'var(--accent)';
      }

      // 카테고리 필터 적용
      let displayTasks = todayAllTasks;
      if (todayFilterCategory !== 'all') {
        displayTasks = todayAllTasks.filter(t => (t.category || '기타') === todayFilterCategory);
      }

      const listEl = document.getElementById('todayTaskList');
      if (!listEl) return;
      listEl.innerHTML = '';

      if (displayTasks.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center; padding:36px 20px; background:var(--card-sub); border:1px dashed var(--border-color); border-radius:var(--radius-md); color:var(--text-muted);">
            <div style="font-size:24px; margin-bottom:8px;">✨</div>
            <div style="font-size:14.5px; font-weight:700; color:var(--text-main);">오늘 예정된 업무가 없습니다.</div>
            <div style="font-size:12.5px; margin-top:4px;">위의 빠른 입력창을 통해 오늘 할 일을 등록해 보세요!</div>
          </div>
        `;
        return;
      }

      displayTasks.forEach(task => listEl.appendChild(createTaskRow(task)));
    }

    // 오늘 할 일 빠른 등록 (오늘 일자로 자동 저장 -> 월간, 주간, 전체 뷰에 즉시 연동)
    function addTodayTaskDirect() {
      const inputEl = document.getElementById('todayTaskInput');
      const title = inputEl.value.trim();
      const category = document.getElementById('todayCategoryInput').value || '기타';
      if (!title) return;

      const todayStr = formatLocalDate(new Date());
      const newTask = {
        id: Date.now().toString(),
        title: title,
        date: todayStr,
        category: category,
        completed: false,
        updatedAt: Date.now()
      };

      tasks.push(newTask);
      inputEl.value = '';
      saveAndSync();
    }

    // ==========================================================================
    // 2. 📅 월간 달력 렌더링 로직 (Month View)
    // ==========================================================================
    function moveMonth(delta) {
      currentViewDate.setMonth(currentViewDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentViewDate.getFullYear();
      const month = currentViewDate.getMonth();
      document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('calDaysGrid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      // 이전 달 날짜 채우기
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = prevLastDate - i;
        const cell = createCalCell(year, month - 1, d, true);
        grid.appendChild(cell);
      }

      // 이번 달 날짜 채우기
      const todayStr = formatLocalDate(new Date());
      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = (dateStr === todayStr);
        const cell = createCalCell(year, month, d, false, isToday);
        grid.appendChild(cell);
      }

      // 다음 달 날짜 채우기 (7의 배수 맞춤)
      const totalCells = firstDay + lastDate;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let d = 1; d <= nextDays; d++) {
        const cell = createCalCell(year, month + 1, d, true);
        grid.appendChild(cell);
      }
    }

    function createCalCell(year, month, day, isOtherMonth, isToday = false) {
      const cellDate = new Date(year, month, day);
      const dateStr = formatLocalDate(cellDate);
      
      const cell = document.createElement('div');
      cell.className = `cal-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
      cell.onclick = () => openDayModal(dateStr);

      const num = document.createElement('div');
      num.className = 'cal-date-num';
      num.innerText = day;
      cell.appendChild(num);

      const eventsWrapper = document.createElement('div');
      eventsWrapper.className = 'cal-cell-events';

      // 일치하는 업무 필터
      const dayTasks = tasks.filter(t => t.date === dateStr);
      dayTasks.slice(0, 3).forEach(t => {
        const pill = document.createElement('div');
        pill.className = `event-pill ${t.completed ? 'done' : ''}`;
        const catClass = ['회의','보고','면담','강의','기타'].includes(t.category) ? `cat-${t.category}` : 'cat-기타';
        pill.innerHTML = `<span class="cat-tag ${catClass}" style="padding:1px 5px; font-size:10px;">${escapeHtml(t.category || '기타')}</span> <span>${escapeHtml(t.title)}</span>`;
        eventsWrapper.appendChild(pill);
      });
      if (dayTasks.length > 3) {
        const more = document.createElement('div');
        more.style.fontSize = '10.5px';
        more.style.fontWeight = '600';
        more.style.color = 'var(--text-sub)';
        more.innerText = `+${dayTasks.length - 3}건 더보기`;
        eventsWrapper.appendChild(more);
      }

      cell.appendChild(eventsWrapper);
      return cell;
    }

    // ==========================================================================
    // 3. 📆 주간 업무 렌더링 & 빠른 추가 (Week View)
    // ==========================================================================
    function moveWeek(delta) {
      currentWeekDate.setDate(currentWeekDate.getDate() + (delta * 7));
      renderWeekly();
    }

    function renderWeekly() {
      const base = new Date(currentWeekDate);
      const dayOfWeek = base.getDay(); // 0(일) ~ 6(토)
      const startDay = new Date(base);
      startDay.setDate(base.getDate() - dayOfWeek);
      const endDay = new Date(startDay);
      endDay.setDate(startDay.getDate() + 6);

      const startStr = formatLocalDate(startDay);
      const endStr = formatLocalDate(endDay);
      document.getElementById('weekTitle').innerText = `${startStr} ~ ${endStr} 주간 업무`;

      const listEl = document.getElementById('weekTaskList');
      listEl.innerHTML = '';

      const daysOfWeekNames = ['일', '월', '화', '수', '목', '금', '토'];
      const todayStr = formatLocalDate(new Date());

      // 요일별(일요일 ~ 토요일) 그룹 카드 렌더링
      for (let i = 0; i < 7; i++) {
        const d = new Date(startDay);
        d.setDate(startDay.getDate() + i);
        const dStr = formatLocalDate(d);
        const isToday = (dStr === todayStr);

        const dayTasks = tasks.filter(t => t.date === dStr).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));

        const groupEl = document.createElement('div');
        groupEl.className = 'week-day-group';

        groupEl.innerHTML = `
          <div class="week-day-header ${isToday ? 'is-today' : ''}">
            <span>📅 ${dStr} (${daysOfWeekNames[i]}요일) ${isToday ? '⭐ <b style="color:var(--accent);">[오늘]</b>' : ''}</span>
            <span style="font-size:12px; font-weight:600; color:var(--text-muted);">${dayTasks.length}건</span>
          </div>
          <div class="task-list" id="weekGroup_${dStr}"></div>
        `;

        const groupTaskList = groupEl.querySelector(`#weekGroup_${CSS.escape(dStr)}`);
        if (dayTasks.length === 0) {
          groupTaskList.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:4px 0;">등록된 업무 없음</div>`;
        } else {
          dayTasks.forEach(t => groupTaskList.appendChild(createTaskRow(t)));
        }

        listEl.appendChild(groupEl);
      }
    }

    // 주간 빠른 일정 등록 (선택 일자 기준 -> 오늘/월간/전체 뷰에도 즉시 연동)
    function addWeekTaskDirect() {
      const dateEl = document.getElementById('weekQuickDate');
      const titleEl = document.getElementById('weekQuickTitle');
      const catEl = document.getElementById('weekQuickCategory');

      const dateStr = dateEl.value || formatLocalDate(new Date());
      const title = titleEl.value.trim();
      const category = catEl.value || '기타';

      if (!title) return;

      const newTask = {
        id: Date.now().toString(),
        title: title,
        date: dateStr,
        category: category,
        completed: false,
        updatedAt: Date.now()
      };

      tasks.push(newTask);
      titleEl.value = '';
      saveAndSync();
    }

    // ==========================================================================
    // 4. 📋 전체 할 일 뷰 렌더링 (All View)
    // ==========================================================================
    function setAllFilter(category, btnEl) {
      allFilterCategory = category;
      btnEl.parentElement.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderAllTasks();
    }

    function renderAllTasks() {
      const listEl = document.getElementById('allTaskList');
      listEl.innerHTML = '';

      let filtered = tasks;
      if (allFilterCategory !== 'all') {
        filtered = tasks.filter(t => (t.category || '기타') === allFilterCategory);
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:30px; font-weight:500;">등록된 일정이 없습니다. 새 일정을 등록해 보세요!</div>`;
        return;
      }

      const sorted = [...filtered].sort((a,b) => (b.date || '').localeCompare(a.date || '') || (b.updatedAt || 0) - (a.updatedAt || 0));
      sorted.forEach(task => listEl.appendChild(createTaskRow(task)));
    }

    // ==========================================================================
    // 공통 일정 행(Card) 생성 컴포넌트
    // ==========================================================================
    function createTaskRow(task) {
      const row = document.createElement('div');
      row.className = 'task-item';

      const catClass = ['회의','보고','면담','강의','기타'].includes(task.category) ? `cat-${task.category}` : 'cat-기타';
      const todayStr = formatLocalDate(new Date());
      const isToday = (task.date === todayStr);

      row.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskDone('${task.id}', this.checked)">
          <div class="task-content">
            <div class="task-text ${task.completed ? 'done' : ''}">${escapeHtml(task.title)}</div>
            <div class="task-meta">
              <span class="cat-tag ${catClass}">${escapeHtml(task.category || '기타')}</span>
              <span>📅 ${task.date || '일정 미지정'} ${isToday ? '<b style="color:var(--accent);">(오늘)</b>' : ''}</span>
              <span>상태: ${task.completed ? '<b style="color:var(--success)">한 일(완료)</b>' : '<b style="color:var(--accent)">할 일</b>'}</span>
            </div>
          </div>
        </div>
        <div class="task-actions">
          <button onclick="openEditModal('${task.id}')">수정</button>
          <button onclick="deleteTask('${task.id}')" style="color:var(--danger)">삭제</button>
        </div>
      `;
      return row;
    }

    // ==========================================================================
    // CRUD 및 모달 제어 로직 (어느 곳에서 조작하든 모든 뷰 자동 연동)
    // ==========================================================================
    function openDayModal(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('dayModalDateTitle').innerText = `${dateStr} 일정 상세`;
      renderDayModalTasks();
      document.getElementById('quickTaskTitle').value = '';
      document.getElementById('quickTaskCategory').value = '회의';
      document.getElementById('dayDetailModal').classList.add('active');
    }

    function closeDayModal() {
      document.getElementById('dayDetailModal').classList.remove('active');
      renderAllViews();
    }

    function renderDayModalTasks() {
      const container = document.getElementById('dayModalTasksList');
      container.innerHTML = '';
      const dayTasks = tasks.filter(t => t.date === selectedDateStr);

      if (dayTasks.length === 0) {
        container.innerHTML = `<div style="font-size:12.5px; color:var(--text-muted); padding:6px 0;">등록된 일정이 없습니다.</div>`;
        return;
      }

      dayTasks.forEach(t => {
        const item = document.createElement('div');
        const catClass = ['회의','보고','면담','강의','기타'].includes(t.category) ? `cat-${t.category}` : 'cat-기타';
        item.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:var(--card-sub); border:1px solid var(--border-color); padding:8px 12px; border-radius:8px; font-size:13px;";
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTaskDone('${t.id}', this.checked); renderDayModalTasks();">
            <span class="cat-tag ${catClass}" style="padding:1px 5px; font-size:10px;">${escapeHtml(t.category || '기타')}</span>
            <span style="${t.completed ? 'text-decoration:line-through; opacity:0.5;' : 'font-weight:600;'}">${escapeHtml(t.title)}</span>
          </div>
          <button onclick="deleteTask('${t.id}'); renderDayModalTasks();" style="color:var(--danger); border:none; background:none; cursor:pointer; font-size:14px; padding:2px 6px;">✕</button>
        `;
        container.appendChild(item);
      });
    }

    function addQuickTask() {
      const title = document.getElementById('quickTaskTitle').value.trim();
      const category = document.getElementById('quickTaskCategory').value.trim() || '기타';
      if (!title) return;

      const newTask = {
        id: Date.now().toString(),
        title: title,
        date: selectedDateStr,
        category: category,
        completed: false,
        updatedAt: Date.now()
      };
      tasks.push(newTask);
      document.getElementById('quickTaskTitle').value = '';
      saveAndSync();
      renderDayModalTasks();
    }

    function toggleTaskDone(id, isDone) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = isDone;
        task.updatedAt = Date.now();
        saveAndSync();
      }
    }

    function deleteTask(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      tasks = tasks.filter(t => t.id !== id);
      saveAndSync();
    }

    function openCreateModal(defaultDate) {
      document.getElementById('editModalTitle').innerText = '새 일정 등록';
      document.getElementById('editTaskId').value = '';
      document.getElementById('editTitle').value = '';
      document.getElementById('editDate').value = defaultDate || formatLocalDate(new Date());
      document.getElementById('editCategory').value = '회의';
      document.getElementById('editStatus').value = '할일';
      document.getElementById('editModal').classList.add('active');
    }

    function openEditModal(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('editModalTitle').innerText = '일정 수정';
      document.getElementById('editTaskId').value = task.id;
      document.getElementById('editTitle').value = task.title;
      document.getElementById('editDate').value = task.date;
      document.getElementById('editCategory').value = task.category || '기타';
      document.getElementById('editStatus').value = task.completed ? '한일' : '할일';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    function saveTaskDetails() {
      const id = document.getElementById('editTaskId').value;
      const title = document.getElementById('editTitle').value.trim();
      const date = document.getElementById('editDate').value;
      const category = document.getElementById('editCategory').value.trim() || '기타';
      const isDone = (document.getElementById('editStatus').value === '한일');

      if (!title) { alert('업무 내용을 입력하세요.'); return; }

      if (id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.title = title;
          task.date = date;
          task.category = category;
          task.completed = isDone;
          task.updatedAt = Date.now();
        }
      } else {
        tasks.push({
          id: Date.now().toString(),
          title: title,
          date: date,
          category: category,
          completed: isDone,
          updatedAt: Date.now()
        });
      }

      closeEditModal();
      saveAndSync();
    }

    function saveAndSync() {
      localStorage.setItem('vault_tasks', JSON.stringify(tasks));
      renderAllViews();
      if (syncConfig.token) pushToGitHub();
    }

    // ==========================================================================
    // GitHub AES-256 종단간 보안 동기화
    // ==========================================================================
    function openSyncModal() {
      document.getElementById('ghToken').value = syncConfig.token || '';
      document.getElementById('ghOwner').value = syncConfig.owner || '';
      document.getElementById('ghRepo').value = syncConfig.repo || 'my-task-vault';
      document.getElementById('ghSecretKey').value = syncConfig.secretKey || '';
      document.getElementById('syncModal').classList.add('active');
    }
    function closeSyncModal() { document.getElementById('syncModal').classList.remove('active'); }

    function saveSyncSettings() {
      syncConfig = {
        token: document.getElementById('ghToken').value.trim(),
        owner: document.getElementById('ghOwner').value.trim(),
        repo: document.getElementById('ghRepo').value.trim(),
        secretKey: document.getElementById('ghSecretKey').value.trim()
      };
      localStorage.setItem('vault_sync_cfg', JSON.stringify(syncConfig));
      closeSyncModal();
      pullFromGitHub();
    }

    function updateSyncStatus(type) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      if (type === 'online') {
        el.className = 'status-badge online';
        el.innerHTML = '<span class="status-dot"></span>클라우드 동기화 됨';
      } else if (type === 'syncing') {
        el.className = 'status-badge syncing';
        el.innerHTML = '<span class="status-dot"></span>동기화 중...';
      } else {
        el.className = 'status-badge offline';
        el.innerHTML = '<span class="status-dot"></span>오프라인 모드';
      }
    }

    // Pull (데이터 수신 및 복호화)
    async function pullFromGitHub(isSilent = false) {
      if (!syncConfig.token || !syncConfig.owner || isSyncing) return;
      if (!isSilent) updateSyncStatus('syncing');

      const url = `https://api.github.com/repos/${syncConfig.owner}/${syncConfig.repo}/contents/tasks_vault.json?t=${Date.now()}`;
      try {
        const res = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${syncConfig.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.status === 200) {
          const data = await res.json();
          currentSha = data.sha;
          const cleanBase64 = data.content.replace(/\s/g, '');
          const decodedEncrypted = decodeURIComponent(escape(atob(cleanBase64)));

          if (syncConfig.secretKey) {
            try {
              const bytes = CryptoJS.AES.decrypt(decodedEncrypted, syncConfig.secretKey);
              const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
              if (decryptedStr) {
                const remoteTasks = JSON.parse(decryptedStr);
                tasks = mergeTasks(tasks, remoteTasks);
                localStorage.setItem('vault_tasks', JSON.stringify(tasks));
                renderAllViews();
                updateSyncStatus('online');
              } else {
                updateSyncStatus('offline');
              }
            } catch(e) {
              console.error('복호화 실패. 암호화 마스터 키를 확인하세요.', e);
              updateSyncStatus('offline');
            }
          }
        } else if (res.status === 404) {
          updateSyncStatus('online');
          pushToGitHub();
        } else {
          updateSyncStatus('offline');
        }
      } catch (err) {
        console.error('동기화 수신 에러:', err);
        updateSyncStatus('offline');
      }
    }

    // Push (암호화 및 GitHub 전송)
    async function pushToGitHub() {
      if (!syncConfig.token || !syncConfig.owner || !syncConfig.secretKey || isSyncing) return;
      isSyncing = true;
      updateSyncStatus('syncing');

      const url = `https://api.github.com/repos/${syncConfig.owner}/${syncConfig.repo}/contents/tasks_vault.json`;
      const plainText = JSON.stringify(tasks);
      const encrypted = CryptoJS.AES.encrypt(plainText, syncConfig.secretKey).toString();
      const contentBase64 = btoa(unescape(encodeURIComponent(encrypted)));

      const body = {
        message: 'Sync schedule and tasks via Web Vault',
        content: contentBase64
      };
      if (currentSha) body.sha = currentSha;

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${syncConfig.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          const data = await res.json();
          currentSha = data.content.sha;
          updateSyncStatus('online');
        } else if (res.status === 409) {
          isSyncing = false;
          await pullFromGitHub();
        } else {
          updateSyncStatus('offline');
        }
      } catch (err) {
        console.error('동기화 전송 에러:', err);
        updateSyncStatus('offline');
      } finally {
        isSyncing = false;
      }
    }

    // 스마트 병합
    function mergeTasks(local, remote) {
      const map = new Map();
      local.forEach(t => map.set(t.id, t));
      remote.forEach(r => {
        if (!map.has(r.id)) {
          map.set(r.id, r);
        } else {
          const l = map.get(r.id);
          if ((r.updatedAt || 0) >= (l.updatedAt || 0)) map.set(r.id, r);
        }
      });
      return Array.from(map.values()).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function triggerManualSync() { pullFromGitHub(); }

    function formatLocalDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 오프라인 백업 및 복원
    function exportBackup() {
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `schedule-backup-${formatLocalDate(new Date())}.json`;
      a.click();
    }

    function importBackup() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            tasks = JSON.parse(ev.target.result);
            saveAndSync();
          } catch(err) { alert('올바른 JSON 백업 파일이 아닙니다.'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }
  </script>
</body>
